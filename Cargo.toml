[package]
name = "odf-crypto"
version = "0.1.0"
edition = "2021"
description = "LibreOffice-faithful ODF package encryption detection, decryption and encryption"
rust-version = "1.85"

[features]
default = ["encrypt"]
decrypt = [
    "dep:sha1",
    "dep:sha2",
    "dep:hmac",
    "dep:pbkdf2",
    "dep:argon2",
    "dep:aes",
    "dep:cbc",
    "dep:aes-gcm",
    "dep:blowfish",
    "dep:cfb-mode",
    "dep:miniz_oxide",
]
# encrypt implies decrypt: the two directions share the AES-GCM/Argon2id
# primitives (src/kdf.rs) -- do not also list "decrypt" in `default`, that
# would be redundant.
encrypt = ["decrypt"]

[dependencies]
quick-xml = "0.38"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Not gated behind `decrypt`: this is the crate's only zeroizing primitive, so
# it's unconditional rather than following the optional-dependency pattern
# below. Its own zeroize-on-drop replaces the direct `zeroize` dependency this
# crate used to carry.
# alloc only: this crate needs Dynamic<Vec<u8>> for password/key material, not
# the encoding/rand/ct-eq extras EFV and DebitLeft pull in for their own use.
secure-gate = { version = "0.9.0-rc.7", default-features = false, features = [
    "alloc",
] }

sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
pbkdf2 = { version = "0.12", optional = true }
argon2 = { version = "0.5", optional = true }
# Same reasoning as aes-gcm's "zeroize" below, applied to the per-entry ciphers:
# secure-gate wraps the derived key, but each cipher expands its own key
# schedule from it, and those allocations are outside the wrapper's reach.
# `aes`, `blowfish`, `cbc` and `cfb-mode` all expose a `zeroize` feature that
# wipes that state on drop; without it the AES-CBC and Blowfish read paths left
# an expanded schedule behind where the GCM path did not.
aes = { version = "0.8", optional = true, features = ["zeroize"] }
cbc = { version = "0.1", optional = true, features = ["zeroize"] }
# "getrandom" is aes-gcm's own default feature (its Cargo.toml: default =
# ["aes", "alloc", "getrandom"]) -- named explicitly here, not left implicit,
# so the reliance is pinned against aes-gcm ever changing its own defaults.
# It gates `aes_gcm::aead::OsRng` / `aes_gcm::aead::rand_core::RngCore`, which
# encrypt's salt/IV generation uses; this is not a new crate dependency (plan
# OQ2, settled 2026-09-03). "zeroize" wipes the expanded AES key schedule on
# drop: `secure-gate` wraps the derived key itself, but the key schedule the
# cipher expands from it is aes-gcm's own allocation and out of the wrapper's
# reach -- the same class of residual the secure-gate skill names for the hash
# crates, except this one the dependency can close, so it is turned on. It adds
# no crate: secure-gate already depends on zeroize internally.
aes-gcm = { version = "0.10", optional = true, features = ["getrandom", "zeroize"] }
blowfish = { version = "0.9", optional = true, features = ["zeroize"] }
cfb-mode = { version = "0.8", optional = true, features = ["zeroize"] }
miniz_oxide = { version = "0.8", optional = true }

# PBKDF2 at 100k iterations and Argon2id at m=64 MiB are unusably slow in an
# unoptimised build - the suite goes from under a second to ~90. Optimise the
# dependency graph only; the crate itself stays unoptimised and debuggable.
[profile.dev.package."*"]
opt-level = 3

# Without this, `cargo test` (which builds every example target by default)
# tries to compile encrypt_for_validation.rs even when the "encrypt" feature
# is off, and fails: the example calls odf_crypto::encrypt() unconditionally,
# but that symbol only exists behind #[cfg(feature = "encrypt")] (src/lib.rs).
# required-features tells Cargo to skip the target instead when the feature
# set doesn't satisfy it.
[[example]]
name = "encrypt_for_validation"
required-features = ["encrypt"]
