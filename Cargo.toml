[package]
name = "odf-crypto"
version = "0.1.0-rc.1"
edition = "2021"
description = "LibreOffice-faithful ODF package encryption detection, decryption and encryption"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Slurp9187/odf-crypto"
readme = "README.md"
keywords = ["odf", "libreoffice", "opendocument", "encryption", "decrypt"]
categories = ["cryptography", "parser-implementations"]
# Allowlist -- everything not named here stays out of the tarball uploaded to
# crates.io. It does NOT affect git: docs/, .claude/, CHANGELOG.md and the
# Python helpers under tests/goldens/ all remain in the repository and on GitHub.
#
# Those helpers are developer tooling, not test inputs: no Rust code invokes them
# (they appear only in doc comments and one assertion message) and each needs a
# local LibreOffice over UNO to do anything.
#
# Trimmed to what the tarball provably needs; each entry was tested by removing
# it and packaging.
#
#   - src/**/*.rs must include the *_tests.rs files and test_support.rs. They are
#     pulled in by `#[cfg(test)] #[path = "..."] mod tests;`, so without them the
#     published crate fails `cargo test` with "couldn't read src/classify_tests.rs".
#     Dropping those and the goldens takes the tarball from 350K to 180K and
#     leaves a crate that distro packagers, `cargo vendor` audits and anyone
#     checking the LibreOffice-fidelity claim cannot run. Not a trade worth 170K.
#   - tests/goldens/*.odt are what `test_support::load_golden` reads, so they
#     follow the tests.
#   - LICENSE-* are not auto-included (that only happens for `license-file`, and
#     this crate uses an SPDX `license` expression). Both licences require the
#     text to travel with the copy: MIT's notice clause, Apache-2.0 section 4(a).
#   - examples/encrypt_for_validation.rs is NOT load-bearing -- cargo warns and
#     packages happily without it. Kept anyway: dropping it saves 8K of 350K and
#     buys a warning on every publish, because the [[example]] table below would
#     then declare a target the tarball does not contain.
#
# README.md is absent deliberately: `readme = "README.md"` above makes cargo
# include it regardless, so listing it here was redundant.
include = [
    "src/**/*.rs",
    "examples/encrypt_for_validation.rs",
    "tests/goldens/*.odt",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

# docs.rs builds with default features unless told otherwise, and the default
# here is detection-only -- without this the rendered docs would omit `decrypt`
# and `encrypt` entirely.
[package.metadata.docs.rs]
all-features = true
# Enables the `docsrs` cfg so `doc_auto_cfg` marks `decrypt` / `encrypt` /
# `DecryptError` / `EncryptError` as "Available on crate feature `crypto-ops`".
# Inert on stable, so the MSRV job is unaffected.
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Detection only. `classify` needs no cryptographic dependency, so the default
# build pulls 27 crates where a cryptographic one pulls 61. Nobody pays for a
# cipher stack to ask whether a file is encrypted.
#
# It does still pull an inflate implementation -- zip -> flate2 -> miniz_oxide,
# unconditional -- because every LibreOffice golden stores META-INF/manifest.xml
# DEFLATED and `classify` has to read it. "No cryptographic dependency" is the
# accurate claim; "no inflate dependency" was not.
#
# Reproduce both figures with:
#   cargo tree --locked -e no-dev --prefix none [--features crypto-ops] \n#     | grep -v '(\*)' | sort -u | wc -l
default = []

# Everything past detection: `decrypt` and `encrypt`.
#
# This was two features, `decrypt` and `encrypt` with `encrypt = ["decrypt"]`.
# They were collapsed because the split earned nothing it cost. Both pulled an
# identical dependency graph -- the 34-crate saving is this feature versus the
# default, never one direction versus the other -- and a consumer that never
# calls `encrypt` has it eliminated at link time regardless. What the split did
# produce was a third build configuration in which a bound could be dead in
# neither of the others: `DEFLATE_CEILING` was live under `encrypt`, live under
# nothing, and dead under `decrypt` alone. One fewer configuration is one fewer
# place for a mis-scoped `cfg` to hide.
#
# Named for what it gates, which is not only ciphers: pbkdf2 and argon2 are
# KDFs, sha1/sha2 are hashes, hmac is a MAC, and miniz_oxide is compression.
crypto-ops = [
    "dep:sha1",
    "dep:sha2",
    "dep:hmac",
    "dep:pbkdf2",
    "dep:argon2",
    "dep:aes",
    "dep:cbc",
    "dep:aes-gcm",
    "dep:blowfish",
    "dep:cfb-mode",
    "dep:miniz_oxide",
]

[dependencies]
quick-xml = "0.38"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Not gated behind `decrypt`: this is the crate's only zeroizing primitive, so
# it's unconditional rather than following the optional-dependency pattern
# below. Its own zeroize-on-drop replaces the direct `zeroize` dependency this
# crate used to carry.
# alloc only: this crate needs Dynamic<Vec<u8>> for password/key material, not
# the encoding/rand/ct-eq extras EFV and DebitLeft pull in for their own use.
secure-gate = { version = "0.9.0-rc.7", default-features = false, features = [
    "alloc",
] }

sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
pbkdf2 = { version = "0.12", optional = true }
argon2 = { version = "0.5", optional = true }
# Same reasoning as aes-gcm's "zeroize" below, applied to the per-entry ciphers:
# secure-gate wraps the derived key, but each cipher expands its own key
# schedule from it, and those allocations are outside the wrapper's reach.
# `aes`, `blowfish`, `cbc` and `cfb-mode` all expose a `zeroize` feature that
# wipes that state on drop; without it the AES-CBC and Blowfish read paths left
# an expanded schedule behind where the GCM path did not.
aes = { version = "0.8", optional = true, features = ["zeroize"] }
cbc = { version = "0.1", optional = true, features = ["zeroize"] }
# "getrandom" is aes-gcm's own default feature (its Cargo.toml: default =
# ["aes", "alloc", "getrandom"]) -- named explicitly here, not left implicit,
# so the reliance is pinned against aes-gcm ever changing its own defaults.
# It gates `aes_gcm::aead::OsRng` / `aes_gcm::aead::rand_core::RngCore`, which
# encrypt's salt/IV generation uses; this is not a new crate dependency (plan
# OQ2, settled 2026-09-03). "zeroize" wipes the expanded AES key schedule on
# drop: `secure-gate` wraps the derived key itself, but the key schedule the
# cipher expands from it is aes-gcm's own allocation and out of the wrapper's
# reach -- the same class of residual the secure-gate skill names for the hash
# crates, except this one the dependency can close, so it is turned on. It adds
# no crate: secure-gate already depends on zeroize internally.
aes-gcm = { version = "0.10", optional = true, features = ["getrandom", "zeroize"] }
blowfish = { version = "0.9", optional = true, features = ["zeroize"] }
cfb-mode = { version = "0.8", optional = true, features = ["zeroize"] }
miniz_oxide = { version = "0.8", optional = true }

# PBKDF2 at 100k iterations and Argon2id at m=64 MiB are unusably slow in an
# unoptimised build - the suite goes from under a second to ~90. Optimise the
# dependency graph only; the crate itself stays unoptimised and debuggable.
[profile.dev.package."*"]
opt-level = 3

# Without this, `cargo test` (which builds every example target by default)
# tries to compile encrypt_for_validation.rs even when "crypto-ops" is off, and
# fails: the example calls odf_crypto::encrypt() unconditionally, but that
# symbol only exists behind #[cfg(feature = "crypto-ops")] (src/lib.rs).
# required-features tells Cargo to skip the target instead when the feature
# set doesn't satisfy it.
[[example]]
name = "encrypt_for_validation"
required-features = ["crypto-ops"]

# Enforcement lives here rather than in RUSTFLAGS: a lint set in RUSTFLAGS
# applies to every crate Cargo compiles, dependencies included, so a new warning
# in quick-xml would fail the build over code nobody here can edit. The [lints]
# table applies to this package alone.
#
# All `warn`, never `deny`. CI already escalates -- `cargo clippy ... -- -D
# warnings` and RUSTDOCFLAGS: -D warnings -- so these are hard failures there
# while a work-in-progress `cargo check` stays usable locally.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"
unescaped_backticks = "warn"
private_doc_tests = "warn"

[lints.clippy]
# Named individually, not via `pedantic = "warn"`: that group drags in
# doc_markdown, whose 21 hits here are mostly the prose word "LibreOffice".
missing_errors_doc = "warn"
missing_panics_doc = "warn"
too_long_first_doc_paragraph = "warn"
