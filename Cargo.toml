[package]
name = "odf-crypto"
version = "0.1.0-rc.18"
edition = "2021"
description = "LibreOffice-faithful encryption for ODF packages (.odt, .ods, .odp): detect it, decrypt it, write it"
rust-version = "1.88"
# Every src/bin/*.rs is otherwise auto-discovered as its own binary, which turns
# the CLI's `#[path]` test module into a second bin target with no `main`. The
# one binary is declared explicitly in [[bin]] below.
autobins = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/Slurp9187/odf-crypto"
# Without this, crates.io only links to docs.rs once docs.rs reports a
# successful build -- which is exactly what was broken for rc.1. Explicit is
# one less thing depending on a build that might fail.
documentation = "https://docs.rs/odf-crypto"
readme = "README.md"
keywords = ["odf", "odt", "libreoffice", "opendocument", "decrypt"]
categories = ["cryptography", "parser-implementations"]
# Allowlist -- everything not named here stays out of the tarball uploaded to
# crates.io. It does NOT affect git: docs/, .claude/, CHANGELOG.md and the
# Python helpers under tests/goldens/ all remain in the repository and on GitHub.
#
# Those helpers are developer tooling, not test inputs: no Rust code invokes them
# (they appear only in doc comments and one assertion message). make_goldens.py
# and validate_encrypt.py need a local LibreOffice over UNO; ref_decrypt.py and
# sha1_star.py do not -- ref_decrypt.py's sweep runs offline on `cryptography`
# and `argon2-cffi` alone. Excluding them is a tarball-size decision, not a
# statement that they are unrunnable.
#
# Trimmed to what the tarball provably needs; each entry was tested by removing
# it and packaging.
#
#   - src/**/*.rs must include the *_tests.rs files and test_support.rs. They are
#     pulled in by `#[cfg(test)] #[path = "..."] mod tests;`, so without them the
#     published crate fails `cargo test` with "couldn't read src/classify_tests.rs".
#     Dropping those and the goldens takes the tarball from 350K to 180K and
#     leaves a crate that distro packagers, `cargo vendor` audits and anyone
#     checking the LibreOffice-fidelity claim cannot run. Not a trade worth 170K.
#   - tests/goldens/*.odt are what `test_support::load_golden` reads, so they
#     follow the tests.
#   - LICENSE-* are not auto-included (that only happens for `license-file`, and
#     this crate uses an SPDX `license` expression). Both licences require the
#     text to travel with the copy: MIT's notice clause, Apache-2.0 section 4(a).
#   - examples/encrypt_for_validation.rs is NOT load-bearing -- cargo warns and
#     packages happily without it. Kept anyway: dropping it saves 8K of 350K and
#     buys a warning on every publish, because the [[example]] table below would
#     then declare a target the tarball does not contain.
#
# README.md is absent deliberately: `readme = "README.md"` above makes cargo
# include it regardless, so listing it here was redundant.
include = [
    # Covers src/bin/ too, so the `cli` binary ships. The allowlist is an
    # allowlist: a new directory is excluded until a pattern names it.
    "src/**/*.rs",
    "examples/encrypt_for_validation.rs",
    "tests/goldens/*.odt",
    # Synthesized, LibreOffice-accepted SHA-1 ladder fixtures; see make_ladder.py.
    "tests/ladder/*.odt",
    # The CLI's end-to-end suite. `#![cfg(feature = "cli")]` throughout, so it
    # compiles to nothing without the feature and costs a library consumer
    # nothing -- but the published tarball can then run it, like the rest.
    "tests/cli.rs",
    # Crate-written fixtures (tests/artifacts/MANIFEST.md says how each was
    # checked against LibreOffice). Shipped since the streaming arc: the
    # `every_fixture` corpus tests assert this directory is not empty, so a
    # tarball without it would fail its own tests.
    "tests/artifacts/*.odt",
    # The memory-bound test for the `*_to` entry points. Its own binary,
    # because it installs a counting global allocator.
    "tests/streaming_memory.rs",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

# docs.rs builds with default features unless told otherwise, and the default
# here is detection-only -- without this the rendered docs would omit `decrypt`
# and `encrypt` entirely.
[package.metadata.docs.rs]
all-features = true
# Enables the `docsrs` cfg so `doc_auto_cfg` marks `decrypt` / `encrypt` /
# `DecryptError` / `EncryptError` as "Available on crate feature `crypto-ops`".
# Inert on stable, so the MSRV job is unaffected.
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Detection only. `classify` needs no cryptographic dependency, so the default
# build pulls 24 crates on Linux where a cryptographic one pulls 63. Nobody pays for a
# cipher stack to ask whether a file is encrypted.
#
# It does still pull an inflate implementation -- zip -> flate2 -> miniz_oxide,
# unconditional -- because every LibreOffice golden stores META-INF/manifest.xml
# DEFLATED and `classify` has to read it. "No cryptographic dependency" is the
# accurate claim; "no inflate dependency" was not.
#
# Reproduce both figures with:
#   cargo tree --locked -e no-dev --prefix none [--features crypto-ops] \n#     | grep -v '(\*)' | sort -u | wc -l
default = []

# Everything past detection: `decrypt` and `encrypt`.
#
# This was two features, `decrypt` and `encrypt` with `encrypt = ["decrypt"]`.
# They were collapsed because the split earned nothing it cost. Both pulled an
# identical dependency graph -- the 34-crate saving is this feature versus the
# default, never one direction versus the other -- and a consumer that never
# calls `encrypt` has it eliminated at link time regardless. What the split did
# produce was a third build configuration in which a bound could be dead in
# neither of the others: `DEFLATE_CEILING` was live under `encrypt`, live under
# nothing, and dead under `decrypt` alone. One fewer configuration is one fewer
# place for a mis-scoped `cfg` to hide.
#
# Named for what it gates, which is not only ciphers: pbkdf2 and argon2 are
# KDFs, sha1/sha2 are hashes, hmac is a MAC, and miniz_oxide is compression.
# The `odf-crypto` binary. Default OFF: a library consumer must not pay for an
# argument parser or a terminal crate to link `classify`.
#
# `cargo install odf-crypto --features cli` is the install line. Making it a
# default would put rpassword in front of every library consumer, and
# `cargo install` on a library is not the common path anyway.
cli = ["crypto-ops", "dep:rpassword", "dep:clap", "dep:serde_json", "dep:ctrlc"]

crypto-ops = [
    "dep:sha1",
    "dep:sha2",
    "dep:hmac",
    "dep:pbkdf2",
    "dep:argon2",
    "dep:rayon",
    "dep:aes",
    "dep:cbc",
    "dep:getrandom",
    "dep:ctr",
    "dep:crc32fast",
    "dep:ghash",
    "dep:blowfish",
    "dep:cfb-mode",
    "dep:miniz_oxide",
]

[dependencies]
quick-xml = "0.41"
thiserror = "2"
# `deflate-flate2` plus flate2's `rust_backend` is the pair zip 2.4.2's
# `deflate` meant: flate2 over miniz_oxide. zip 8's and 9's `deflate` names zopfli
# (used only above level 9, and nothing here sets a level) and zlib-rs, whose
# output differs from miniz_oxide's -- which broke `decrypt`'s byte-for-byte
# rc.9 pin and `zip_stream`'s byte comparison against zip's own writer.
# zip declares flate2 with `default-features = false`, so the backend is
# chosen by naming flate2 here; nothing calls it directly. A consumer that
# enables another flate2 backend (EFV enables zlib-rs) gets that one by
# feature unification: still valid DEFLATE, different bytes.
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# Not gated behind `decrypt`: this is the crate's only zeroizing primitive, so
# it's unconditional rather than following the optional-dependency pattern
# below. Its own zeroize-on-drop replaces the direct `zeroize` dependency this
# crate used to carry.
# alloc only: this crate needs Dynamic<Vec<u8>> for password/key material, not
# the encoding/rand/ct-eq extras EFV and DebitLeft pull in for their own use.
#
# Pinned with `=`, unlike every other dependency here, because a caret
# requirement over a PRE-RELEASE matches later pre-releases of the same version
# -- and those carry breaking changes, since a release candidate makes no
# compatibility promise. This is not hypothetical: `cargo update --dry-run` on
# the previous `"0.9.0-rc.7"` resolved straight to rc.11, which deleted the
# `dynamic_alias!` macro `src/sensitive.rs` was built on. The lockfile was the
# only thing holding rc.7 in place. `=` makes the next move an edit somebody
# reads -- and it earned that within hours: rc.12 published the same day and
# changed `Dynamic::new_with`'s signature, so the pin turned a silent build
# break into a deliberate bump.
#
# Compatibility is the lesser half of the argument. The stronger half is YANKS.
# 20 of secure-gate's 54 published versions are yanked, and a yank is how an
# author says "stop using this" -- sometimes for a security reason that had to
# be acted on. A caret requirement answers a yank by silently resolving to a
# NEIGHBOURING pre-release, which may be the very version the yank existed to
# move people off. `=` answers it by failing to resolve, loudly, so a human
# decides. For a crate whose reason to exist is cryptographic, a hard stop beats
# a silent substitution.
#
# So do NOT assume the `=` can be relaxed once 0.9.0 is stable. The pre-release
# argument expires then; the yank argument does not. Revisit it as a decision,
# with whoever maintains secure-gate, rather than treating a stable version
# number as permission.
secure-gate = { version = "=0.9.0-rc.17", default-features = false, features = [
    "alloc",
] }

# The digest 0.11 line, for its "zeroize": each forwards to `digest/zeroize`,
# which wipes the hash core's state and its buffer of not-yet-compressed input
# on drop, and hmac's covers the ipad/opad cores that hold the HMAC key state.
# Those are password and start-key bytes on every path here (`kdf::start_key`,
# PBKDF2-HMAC-SHA1 in `decrypt`). The 0.10 line had no such feature, so all of
# it was freed unwiped. `default-features = false` drops sha1/sha2's `oid`.
# sha1 0.10's `compress` feature is gone: `block_api::compress`, which
# `kdf::staroffice_sha1` needs, is public unconditionally in 0.11.
sha1 = { version = "0.11", optional = true, default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11", optional = true, default-features = false, features = ["zeroize"] }
hmac = { version = "0.13", optional = true, features = ["zeroize"] }
pbkdf2 = { version = "0.13", optional = true }
# 0.6 with `parallel`: Argon2id's lanes run on threads, one per lane up to the
# host's cores. At LibreOffice's (t=3, 64 MiB, p=4), 118 -> 53 ms on 4 vCPU with
# identical output (measured rc.15). rayon is named too, because `kdf.rs`
# builds the pool itself: rayon's global pool panics if it cannot spawn, and a
# local pool's `build` returns an error instead.
# "zeroize" makes argon2's `Block` implement `Zeroize`, so `kdf.rs` can hold
# the password-derived working memory in a secure-gate `Dynamic<Vec<Block>>`,
# and wipes argon2's own `initial_hash` and per-block hash temporaries.
argon2 = { version = "0.6", optional = true, default-features = false, features = ["alloc", "parallel", "zeroize"] }
rayon = { version = "1.10", optional = true }
# Same reasoning as the streaming GCM's "zeroize" below, applied to the per-entry ciphers:
# secure-gate wraps the derived key, but each cipher expands its own key
# schedule from it, and those allocations are outside the wrapper's reach.
# `aes`, `blowfish`, `cbc` and `cfb-mode` all expose a `zeroize` feature that
# wipes that state on drop; without it the AES-CBC and Blowfish read paths left
# an expanded schedule behind where the GCM path did not.
aes = { version = "0.8", optional = true, features = ["zeroize"] }
cbc = { version = "0.1", optional = true, features = ["zeroize"] }
# encrypt's salt and IV (`encrypt::random_bytes`). Until rc.15 this came from
# `aes_gcm::aead::OsRng`, which was aes-gcm's last runtime use: the streaming
# GCM below never called it. `zip` 9.1.3 depends on getrandom 0.4
# unconditionally, so naming it adds no crate. Dropping aes-gcm removed aead,
# aes-gcm, getrandom 0.2, ghash 0.5, polyval 0.6, universal-hash 0.5 and
# opaque-debug; ghash 0.6 brought nine in their place (below), net +2. aes-gcm is now a dev-dependency, kept as the
# reference `stream_tests.rs` proves the streaming GCM against.
getrandom = { version = "0.4", optional = true }
blowfish = { version = "0.9", optional = true, features = ["zeroize"] }
# The streaming AES-GCM (`src/stream.rs`) is composed from `aes`, `ctr` and
# `ghash`, because aes-gcm 0.10 offers only whole-buffer calls. "zeroize" wipes
# the CTR state and the GHASH key on drop.
#
# ghash is 0.6 (on polyval 0.7) while aes and ctr stay on the 0.8/0.9 line: GHASH
# is most of `decrypt_to`'s time, since it runs once in the verify pass and
# again in the release pass, and 0.6 hashes 1.43x faster than 0.5.1 with
# identical output (measured rc.15: `decrypt_to` on a 64 MiB wholesome package
# went 1.83x faster, interleaved A/B, release build). Its generation adds cmov,
# cpubits, cpufeatures 0.3, crypto-common 0.2, ctutils, hybrid-array, polyval
# 0.7 and universal-hash 0.6 beside the 0.8/0.9 line's own. The two lines share
# nothing at the type level; `GcmStream::new` hands H across as a byte array.
ctr = { version = "0.9", optional = true, features = ["zeroize"] }
ghash = { version = "0.6", optional = true, default-features = false, features = ["zeroize"] }
# The streaming zip writer (`src/zip_stream.rs`) computes each member's CRC-32
# itself. Already in the graph under `zip`, so naming it adds no crate.
crc32fast = { version = "1", optional = true }
cfb-mode = { version = "0.8", optional = true, features = ["zeroize"] }
miniz_oxide = { version = "0.8", optional = true }

# Non-echoing password prompt, for the `cli` feature only. Pulls libc,
# rtoolbox and windows-sys; libc is already in the crypto-ops graph. The
# alternative is echoing a password to the terminal, which is not one.
rpassword = { version = "7", optional = true }

# Ctrl-C for the `cli` feature only: the handler cancels the run through the
# library's own reader-driven cancel, so the plaintext temp file beside the
# target is deleted rather than left behind. A second Ctrl-C deletes it and
# exits at once (key derivation cannot be interrupted). A hard kill still
# leaves it: an OS-deleted temp needs a raw call this crate's
# `unsafe_code = "forbid"` rules out. See README, "The CLI".
ctrlc = { version = "=3.5.2", optional = true }

# Builder API, not `derive`, and no `wrap_help`. Measured: derive is 21 crates,
# builder+suggestions is 5, adding wrap_help is 8. Five is worth it for
# `--flag=value`, "did you mean --password-env", and help that cannot drift from
# the definitions it documents. None of it reaches a library consumer: `cli` is
# opt-in, and the default build still resolves 24 crates on Linux.
clap = { version = "4", optional = true, default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }

# No `serde` derive (11 crates); the object is built directly, which is 5.
# Buys nothing today -- json_escape was tested and correct -- but makes one
# class of future error impossible: a field added without escaping. That is
# the same trade clap got, and the `cli` feature is opt-in either way.
serde_json = { version = "1", optional = true }

# PBKDF2 at 100k iterations and Argon2id at m=64 MiB are unusably slow in an
# unoptimised build - the suite goes from under a second to ~90. Optimise the
# dependency graph only; the crate itself stays unoptimised and debuggable.
[profile.dev.package."*"]
opt-level = 3

# Without this, `cargo test` (which builds every example target by default)
# tries to compile encrypt_for_validation.rs even when "crypto-ops" is off, and
# fails: the example calls odf_crypto::encrypt() unconditionally, but that
# symbol only exists behind #[cfg(feature = "crypto-ops")] (src/lib.rs).
# required-features tells Cargo to skip the target instead when the feature
# set doesn't satisfy it.
# required-features is load-bearing, exactly as it is for the example below:
# without it `cargo test --no-default-features` tries to build a binary that
# calls odf_crypto::decrypt, which does not exist in that configuration.
[[bin]]
name = "odf-crypto"
path = "src/bin/odf-crypto.rs"
required-features = ["cli"]

[[example]]
name = "encrypt_for_validation"
required-features = ["crypto-ops"]

# Enforcement lives here rather than in RUSTFLAGS: a lint set in RUSTFLAGS
# applies to every crate Cargo compiles, dependencies included, so a new warning
# in quick-xml would fail the build over code nobody here can edit. The [lints]
# table applies to this package alone.
#
# All `warn`, never `deny`. CI already escalates -- `cargo clippy ... -- -D
# warnings` and RUSTDOCFLAGS: -D warnings -- so these are hard failures there
# while a work-in-progress `cargo check` stays usable locally.
[dev-dependencies]
# The reference the streaming GCM is proved against (`stream_tests.rs`,
# `decrypt_tests.rs`). Dev-only since rc.15: no runtime path uses it.
aes-gcm = { version = "0.10", features = ["zeroize"] }
# The memory-bound test (`tests/streaming_memory.rs`) needs a counting global
# allocator, and `unsafe_code = "forbid"` below covers test targets too: an
# `unsafe impl GlobalAlloc` cannot be written here. This crate is that
# allocator, measured peak and all. Dev-only, so it reaches no consumer and
# no `-e no-dev` crate count. Pinned, as a test's instrument should be.
peak_alloc = "=0.3.0"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"
unescaped_backticks = "warn"
private_doc_tests = "warn"

[lints.clippy]
# Named individually, not via `pedantic = "warn"`: that group drags in
# doc_markdown, whose 21 hits here are mostly the prose word "LibreOffice".
missing_errors_doc = "warn"
missing_panics_doc = "warn"
too_long_first_doc_paragraph = "warn"
