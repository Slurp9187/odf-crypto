name: CI

on:
  # Every branch, not just main: this repo's work lands on feature branches that
  # often have no PR open yet, and a push is the only signal there. The cost is
  # a duplicate run once a PR does exist. Narrow to `[main]` if that noise
  # outweighs the earlier feedback.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede a running check when the same ref is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing is reused between CI runs, so incremental artifacts are written and
  # then thrown away.
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

# `-D warnings` is deliberately NOT set as a global RUSTFLAGS here. RUSTFLAGS
# reaches every crate Cargo compiles, dependencies included, so a new warning in
# quick-xml or zip would fail this workflow over code nobody here can edit.
# Passing `-- -D warnings` to clippy instead applies the denial to this crate
# alone, which is the intent.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: detect-only
            flags: --no-default-features
          - name: crypto-ops
            flags: --no-default-features --features crypto-ops
          # `cli` implies `crypto-ops`, so this entry is a superset -- and it is
          # listed anyway, because the binary compiles in no other
          # configuration. Without it `src/bin/` is never linted at all.
          # Verified by appending an uncalled function to
          # `src/bin/odf-crypto.rs`: clippy (crypto-ops) finished clean, clippy
          # (cli) failed with "function ... is never used".
          - name: cli
            flags: --no-default-features --features cli
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      # --all-targets expands to --lib --bins --tests --benches --examples, so
      # it compiles the library BOTH as a plain lib (cfg(test) off) and as a
      # test harness (cfg(test) on). The plain-lib pass is what catches an item
      # gated `any(feature = "crypto-ops", test)` that has no non-test caller
      # left -- verified by deleting the gate on manifest.rs's encode_b64 and
      # watching this command fail with "function `encode_b64` is never used".
      # A separate lib-only step would add nothing.
      - run: cargo clippy --locked --all-targets ${{ matrix.flags }} -- -D warnings

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `classify_tests` only — `decrypt_tests` and `encrypt_tests` live
          # inside their feature-gated parent modules and compile out here.
          - name: detect-only
            flags: --no-default-features
          - name: crypto-ops
            flags: --no-default-features --features crypto-ops
          # The 52 tests that exist in no other configuration -- 17 CLI unit and
          # 35 end-to-end -- including the two pinning `--password`'s absence
          # from every help output and the one pinning exit code 4.
          #
          # Verified by changing EX_WRONG_PASSWORD from 4 to 41 in tests/cli.rs:
          # test (detect-only) and test (crypto-ops) both stayed green while
          # test (cli) failed at tests/cli.rs:439. `tests/cli.rs` is
          # `#![cfg(feature = "cli")]`, so under the other two its harness
          # reports "0 passed" rather than being absent -- a green line that
          # looks like coverage and is not.
          - name: cli
            flags: --no-default-features --features cli
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      # Cargo.toml sets [profile.dev.package."*"] opt-level = 3 on purpose:
      # PBKDF2 at 100k iterations and Argon2id at m=64 MiB take ~90s unoptimised
      # against under a second optimised. Do not "simplify" that away.
      - run: cargo test --locked ${{ matrix.flags }}

  msrv:
    # Keep in step with `rust-version` in Cargo.toml; bump both together.
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # --locked matters most here: without it Cargo may resolve a dependency
      # release that raised its own MSRV, and the job would fail for a reason
      # that has nothing to do with this crate.
      #
      # Build, not test: dev-dependencies are free to require a newer toolchain
      # than the library's own MSRV promise.
      #
      # `cli`, not `crypto-ops`: `cli` implies `crypto-ops` so this is a strict
      # superset, and it is the only configuration that compiles clap,
      # serde_json and rpassword -- three dependency trees with MSRVs of their
      # own, which `rust-version` in Cargo.toml promises for and nothing here
      # checked. Measured at 1.85.0 before the switch: it builds clean.
      - run: cargo build --locked --no-default-features --features cli

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      # Mirrors [package.metadata.docs.rs] all-features = true, so a broken link
      # is caught here rather than on the docs.rs build after publishing.
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  docsrs:
    name: docs.rs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # docs.rs builds on nightly. The `docs` job above uses stable and does NOT
      # pass --cfg docsrs, so it cannot see anything that only breaks under the
      # cfg this crate's [package.metadata.docs.rs] asks docs.rs to set. That
      # gap shipped once: `feature(doc_auto_cfg)` was removed in Rust 1.92 and
      # became a hard E0557 under --cfg docsrs, which broke the docs.rs build
      # for 0.1.0-rc.1 while every CI job stayed green.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: docsrs
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      # Guards two things at once.
      #
      # The `include` allowlist in Cargo.toml: the verification build compiles
      # the unpacked tarball, so a file the crate needs but the allowlist omits
      # fails here instead of after publishing.
      #
      # Run with `cli`, which is the largest source set. `crypto-ops` is not,
      # though this comment said it was: the binary is
      # `required-features = ["cli"]`, so a crypto-ops verification never
      # compiles `src/bin/` -- the one directory the allowlist's own first
      # comment singles out as needing to ship. Verified by appending a type
      # error to `src/bin/odf-crypto.rs`: `cargo package --features crypto-ops`
      # packaged and verified a tarball whose binary does not compile and said
      # nothing, while `--features cli` failed with E0308.
      #
      # What this still does not guard, because no feature flag changes it:
      # verification does not build `tests/`, so the `tests/cli.rs` and
      # `tests/goldens/*.odt` entries in the allowlist are unchecked here --
      # breaking tests/cli.rs leaves this job green. Tracked in issue #53.
      #
      # And --locked catches a stale Cargo.lock. Bumping `version` alone leaves
      # the lock out of date, which `cargo package` refuses -- a real failure
      # this repo already hit once, at 0.1.0 -> 0.1.0-rc.1.
      - run: cargo package --locked --features cli

  prose:
    name: audit claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: prose
      # Reads the project's prose back against the tree: relative links, this
      # crate's own `file.rs:NNN` citations, backticked `module::item` paths,
      # and the version and MSRV figures in the live documents.
      #
      # Needs cargo, not just Python. Check A's second half asks
      # `cargo package --list` whether a link's target actually SHIPS -- a link
      # into `docs/` resolves in a checkout and 404s from docs.rs, because
      # `include` is an allowlist. Reading the allowlist instead would report
      # README.md and the licence files as broken, since cargo adds those
      # without their appearing in it.
      #
      # `--clone` is pointed at a path that does not exist, so check F (upstream
      # LibreOffice citations) SKIPS rather than fails. No runner has the clone.
      # It is not decoration: locally it verifies every upstream citation in the
      # tree, and this repo cites LibreOffice by line because its behaviour is
      # the specification. The count is printed, never asserted -- writing the
      # changelog entry for this job moved it from 73 to 76.
      - run: python tools/audit_claims.py --clone /nonexistent

# The Python helpers under tests/goldens/ are deliberately NOT run here. Both
# make_goldens.py and validate_encrypt.py bootstrap a local LibreOffice over UNO
# to generate and re-open fixtures; they need a LibreOffice install, they are
# developer tooling rather than test inputs, and no Rust test invokes them. The
# .odt goldens they produce are committed, and those are what the suite reads.
